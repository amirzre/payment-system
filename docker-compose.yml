services:
  postgres-account:
    image: postgres:18-alpine
    container_name: postgres-account
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgresql
      POSTGRES_DB: account
    ports:
      - "5432:5432"
    volumes:
      - pg_account_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d account"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_account_data: