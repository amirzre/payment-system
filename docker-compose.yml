services:
  postgres-account:
    image: postgres:18-alpine
    container_name: postgres-account
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgresql
      POSTGRES_DB: account
    ports:
      - "5432:5432"
    volumes:
      - pg_account_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d account"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  postgres-ledger:
    image: postgres:18-alpine
    container_name: postgres-ledger
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgresql
      POSTGRES_DB: ledger
    ports:
      - "5433:5432"
    volumes:
      - pg_ledger_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ledger"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@email.com
      PGADMIN_DEFAULT_PASSWORD: admin    
    ports:
      - "5050:80"
    depends_on:
      - postgres-account
      - postgres-ledger
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  pg_account_data:
  pg_ledger_data:
  pgadmin_data: