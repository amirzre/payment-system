services:
  postgres-account:
    image: postgres:18-alpine
    container_name: postgres-account
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgresql
      POSTGRES_DB: account
    ports:
      - "5432:5432"
    volumes:
      - pg_account_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d account"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  postgres-ledger:
    image: postgres:18-alpine
    container_name: postgres-ledger
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgresql
      POSTGRES_DB: ledger
    ports:
      - "5433:5432"
    volumes:
      - pg_ledger_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ledger"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-payment:
    image: postgres:18-alpine
    container_name: postgres-payment
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgresql
      POSTGRES_DB: payment
    ports:
      - "5434:5432"
    volumes:
      - pg_payment_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payment"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  postgres-auth:
    image: postgres:18-alpine
    container_name: postgres-auth
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgresql
      POSTGRES_DB: auth
    ports:
      - "5435:5432"
    volumes:
      - pg_auth_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: redis
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.14-alpine
    command: "-js"
    ports: ["4222:4222", "8222:8222"]
    healthcheck:
      test: ["CMD", "nats", "server", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5  

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@email.com
      PGADMIN_DEFAULT_PASSWORD: admin    
    ports:
      - "5050:80"
    depends_on:
      - postgres-account
      - postgres-ledger
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  pg_account_data:
  pg_ledger_data:
  pg_payment_data:
  pg_auth_data:
  pgadmin_data: