name: Auth Service CI

on:
  pull_request:
    paths:
      - services/auth/**
      - shared/**
      - proto/auth/**
      - gen/go/**
      - .github/workflows/_service-ci.yml
      - .github/workflows/auth-ci.yml
  push:
    branches: [main]
    paths:
      - services/auth/**
      - shared/**
      - proto/auth/**
      - gen/go/**
      - .github/workflows/_service-ci.yml
      - .github/workflows/auth-ci.yml

jobs:
  call-reusable:
    uses: ./.github/workflows/_service-ci.yml
    with:
      service: auth
      context: services/auth
      integration: true
