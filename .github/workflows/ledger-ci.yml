name: Ledger Service CI

on:
  pull_request:
    paths:
      - services/ledger/**
      - shared/**
      - proto/ledger/**
      - gen/go/**
      - .github/workflows/_service-ci.yml
      - .github/workflows/ledger-ci.yml
  push:
    branches: [main]
    paths:
      - services/ledger/**
      - shared/**
      - proto/ledger/**
      - gen/go/**
      - .github/workflows/_service-ci.yml
      - .github/workflows/ledger-ci.yml

jobs:
  call-reusable:
    uses: ./.github/workflows/_service-ci.yml
    with:
      service: ledger
      context: services/ledger
      integration: true
