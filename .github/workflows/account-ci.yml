name: Account Service CI

on:
  pull_request:
    paths:
      - services/account/**
      - shared/**
      - proto/account/**
      - proto/ledger/**
      - gen/go/**
      - .github/workflows/_service-ci.yml
      - .github/workflows/account-ci.yml
  push:
    branches: [main]
    paths:
      - services/account/**
      - shared/**
      - proto/account/**
      - proto/ledger/**
      - gen/go/**
      - .github/workflows/_service-ci.yml
      - .github/workflows/account-ci.yml

jobs:
  call-reusable:
    uses: ./.github/workflows/_service-ci.yml
    with:
      service: account
      context: services/account
      integration: true
