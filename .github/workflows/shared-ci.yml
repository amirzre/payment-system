name: Shared CI

on:
  pull_request:
    paths:
      - shared/**
      - gen/go/**
      - .github/workflows/_service-ci.yml
      - .github/workflows/shared-ci.yml
  push:
    branches: [main]
    paths:
      - shared/**
      - gen/go/**
      - .github/workflows/_service-ci.yml
      - .github/workflows/shared-ci.yml

jobs:
  ci:
    name: shared
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false

      - name: Lint
        run: |
          go vet ./shared/...
          go vet ./gen/go/...

      - name: Unit tests
        run: |
          go test ./shared/... -v -race -count=1 -coverprofile=shared.cover -covermode=atomic
