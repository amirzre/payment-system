apiVersion: v1
kind: Secret
metadata:
  name: account-postgres-credentials
  namespace: payment-system
  labels:
    app.kubernetes.io/name: account-postgres
    app.kubernetes.io/component: database
type: Opaque
stringData:
  POSTGRES_USER: account
  POSTGRES_PASSWORD: account
  DATABASE_URL: "postgres://account:account@account-postgres:5432/account?sslmode=disable"
---
