apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth
  namespace: payment-system
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-config
  namespace: payment-system
data:
  SERVER_ENVIRONMENT: "production"
  SERVER_PORT: "50054"
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: payment-system
  labels:
    app.kubernetes.io/name: auth
    app.kubernetes.io/component: service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: auth
  ports:
    - name: grpc
      port: 50054
      targetPort: grpc
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: payment-system
  labels:
    app.kubernetes.io/name: auth
    app.kubernetes.io/component: service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth
        app.kubernetes.io/component: service
    spec:
      serviceAccountName: auth
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: auth
          image: payment-system-auth:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: auth-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: auth-postgres-credentials
                  key: DATABASE_URL
            - name: PRIVATE_KEY_PEM
              valueFrom:
                secretKeyRef:
                  name: auth-signing-keys
                  key: PRIVATE_KEY_PEM
            - name: PUBLIC_KEY_PEM
              valueFrom:
                secretKeyRef:
                  name: auth-signing-keys
                  key: PUBLIC_KEY_PEM
          ports:
            - name: grpc
              containerPort: 50054
              protocol: TCP
          readinessProbe:
            grpc:
              port: 50054
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            grpc:
              port: 50054
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
