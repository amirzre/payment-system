apiVersion: v1
kind: ServiceAccount
metadata:
  name: ledger
  namespace: payment-system
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ledger-config
  namespace: payment-system
data:
  SERVER_ENVIRONMENT: "production"
  SERVER_PORT: "50052"
---
apiVersion: v1
kind: Service
metadata:
  name: ledger
  namespace: payment-system
  labels:
    app.kubernetes.io/name: ledger
    app.kubernetes.io/component: service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ledger
  ports:
    - name: grpc
      port: 50052
      targetPort: grpc
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger
  namespace: payment-system
  labels:
    app.kubernetes.io/name: ledger
    app.kubernetes.io/component: service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ledger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ledger
        app.kubernetes.io/component: service
    spec:
      serviceAccountName: ledger
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ledger
          image: payment-system-ledger:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: ledger-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ledger-postgres-credentials
                  key: DATABASE_URL
            - name: NATS_ADDR
              valueFrom:
                secretKeyRef:
                  name: nats-credentials
                  key: NATS_URL
          ports:
            - name: grpc
              containerPort: 50052
              protocol: TCP
          readinessProbe:
            grpc:
              port: 50052
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            grpc:
              port: 50052
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
