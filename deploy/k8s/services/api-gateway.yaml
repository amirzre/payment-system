apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-gateway
  namespace: payment-system
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: payment-system
data:
  SERVER_ENVIRONMENT: production
  SERVER_PORT: '8080'
  ACCOUNT_GRPC_ADDR: account.payment-system.svc.cluster.local:50051
  PAYMENT_GRPC_ADDR: payment.payment-system.svc.cluster.local:50053
  AUTH_GRPC_ADDR: auth.payment-system.svc.cluster.local:50054
  METRICS_ADDR: :9090
  METRICS_TLS_CERT_FILE: /etc/observability/tls/metrics-server.crt
  METRICS_TLS_KEY_FILE: /etc/observability/tls/metrics-server.key
  METRICS_CLIENT_CA_FILE: /etc/observability/tls/metrics-client-ca.crt
  OTEL_EXPORTER_OTLP_ENDPOINT: https://alloy.observability.svc.cluster.local:4317
  OTEL_EXPORTER_OTLP_CERTIFICATE: /etc/observability/tls/otlp-ca.crt
  OTEL_EXPORTER_OTLP_CLIENT_CERTIFICATE: /etc/observability/tls/otlp-client.crt
  OTEL_EXPORTER_OTLP_CLIENT_KEY: /etc/observability/tls/otlp-client.key
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_TRACES_SAMPLER: always_on
  APP_ENV: kind
  SERVICE_VERSION: observability-2026-10-20
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: payment-system
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/component: gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: payment-system
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/component: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/component: gateway
        observability.payment-system/enabled: 'true'
        observability.payment-system/service: api-gateway
    spec:
      serviceAccountName: api-gateway
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 1000
      containers:
      - name: api-gateway
        image: payment-system-api-gateway:latest
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        envFrom:
        - configMapRef:
            name: api-gateway-config
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: observability-tls
          mountPath: /etc/observability/tls
          readOnly: true
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
      volumes:
      - name: observability-tls
        secret:
          secretName: observability-app-tls
          defaultMode: 288
