[server]
protocol = https
http_port = 3000
domain = localhost
root_url = https://localhost:3000
cert_file = /etc/observability/tls/server.crt
cert_key = /etc/observability/tls/server.key
min_tls_version = TLS1.2
[security]
admin_user = admin
secret_key = $__file{/etc/observability/credentials/secret-key}
admin_password = $__file{/etc/observability/credentials/admin-password}
cookie_secure = true
cookie_samesite = strict
disable_gravatar = true
[users]
allow_sign_up = false
allow_org_create = false
auto_assign_org_role = Viewer
[auth.anonymous]
enabled = false
[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
[plugins]
plugin_admin_enabled = false
preinstall_disabled = true
[news]
news_feed_enabled = false
[snapshots]
external_enabled = false
[live]
enabled = false
[log]
mode = console
level = warn
[paths]
data = /var/lib/grafana
logs = /tmp
plugins = /var/lib/grafana/plugins
provisioning = /etc/grafana/provisioning
