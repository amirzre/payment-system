auth_enabled: false
analytics:
  reporting_enabled: false
server:
  http_listen_port: 3100
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 9095
  http_tls_config:
    cert_file: /etc/observability/tls/server.crt
    key_file: /etc/observability/tls/server.key
    client_auth_type: RequireAndVerifyClientCert
    client_ca_file: /etc/observability/tls/backend-ca.crt
  http_server_read_timeout: 10s
  http_server_write_timeout: 30s
  log_level: warn
memberlist:
  bind_addr: [127.0.0.1]
  advertise_addr: 127.0.0.1
common:
  path_prefix: /data
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /data/chunks
      rules_directory: /data/rules
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
storage_config:
  tsdb_shipper:
    active_index_directory: /data/index
    cache_location: /data/index-cache
compactor:
  working_directory: /data/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 2
  delete_request_store: filesystem
limits_config:
  retention_period: 168h
  ingestion_rate_mb: 0.25
  ingestion_burst_size_mb: 1
  max_line_size: 16384
  max_global_streams_per_user: 1000
  max_entries_limit_per_query: 5000
  max_query_series: 500
  max_query_parallelism: 2
  query_timeout: 30s
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  per_stream_rate_limit: 256KB
  per_stream_rate_limit_burst: 512KB
  max_query_lookback: 168h
querier:
  max_concurrent: 2
frontend:
  address: 127.0.0.1
  max_outstanding_per_tenant: 16
query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 32
