apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: observability
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: payment-system-observability
  ports:
  - name: https
    port: 9090
    targetPort: https
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: observability
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: &prometheus_labels
      app.kubernetes.io/name: prometheus
      app.kubernetes.io/part-of: payment-system-observability
  template:
    metadata:
      labels: *prometheus_labels
      annotations:
        checksum/observability-config: "@CONFIG_HASH_PROMETHEUS@"
    spec:
      serviceAccountName: prometheus
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: prometheus
        image: payment-system-observability-prometheus:@IMAGE_TAG@
        imagePullPolicy: Never
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - name: https
          containerPort: 9090
        volumeMounts:
        - name: tls
          mountPath: /etc/observability/tls
          readOnly: true
        - name: config
          mountPath: /etc/observability/config
          readOnly: true
        - name: data
          mountPath: /prometheus
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: 200m
            memory: 384Mi
          limits:
            cpu: '1'
            memory: 1Gi
        readinessProbe:
          exec:
            command: &prometheus_health_probe
            - /usr/local/bin/observability-probe
            - --url
            - https://127.0.0.1:9090/-/ready
            - --ca
            - /etc/observability/tls/backend-ca.crt
            - --cert
            - /etc/observability/tls/client.crt
            - --key
            - /etc/observability/tls/client.key
            - --server-name
            - prometheus.observability.svc.cluster.local
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        startupProbe:
          exec:
            command: *prometheus_health_probe
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 60
        args:
        - --config.file=/etc/observability/config/prometheus.yml
        - --web.config.file=/etc/observability/config/prometheus-web.yml
        - --storage.tsdb.path=/prometheus
        - --storage.tsdb.retention.time=7d
        - --storage.tsdb.retention.size=4GB
        - --query.max-concurrency=4
        - --query.timeout=30s
        - --query.max-samples=5000000
        - --web.max-connections=128
      volumes:
      - name: tls
        secret:
          secretName: prometheus-tls
          defaultMode: 288
      - name: config
        configMap:
          name: observability-config
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
      - name: data
        persistentVolumeClaim:
          claimName: prometheus
---
