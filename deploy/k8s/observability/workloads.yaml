apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: observability
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: payment-system-observability
  ports:
  - name: https
    port: 3000
    targetPort: https
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: observability
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: &grafana_labels
      app.kubernetes.io/name: grafana
      app.kubernetes.io/part-of: payment-system-observability
  template:
    metadata:
      labels: *grafana_labels
      annotations:
        checksum/observability-config: "@CONFIG_HASH_GRAFANA@"
    spec:
      serviceAccountName: grafana
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: grafana
        image: payment-system-observability-grafana:@IMAGE_TAG@
        imagePullPolicy: Never
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - name: https
          containerPort: 3000
        volumeMounts:
        - name: tls
          mountPath: /etc/observability/tls
          readOnly: true
        - name: config
          mountPath: /etc/observability/config
          readOnly: true
        - name: data
          mountPath: /var/lib/grafana
        - name: tmp
          mountPath: /tmp
        - name: credentials
          mountPath: /etc/observability/credentials
          readOnly: true
        - name: datasources
          mountPath: /etc/grafana/provisioning/datasources
          readOnly: true
        - name: dashboard-provider
          mountPath: /etc/grafana/provisioning/dashboards
          readOnly: true
        - name: dashboard
          mountPath: /etc/grafana/dashboards
          readOnly: true
        resources:
          requests:
            cpu: 150m
            memory: 256Mi
          limits:
            cpu: 750m
            memory: 768Mi
        readinessProbe:
          exec:
            command: &grafana_health_probe
            - /usr/local/bin/observability-probe
            - --url
            - https://127.0.0.1:3000/api/health
            - --ca
            - /etc/observability/tls/backend-ca.crt
            - --cert
            - /etc/observability/tls/client.crt
            - --key
            - /etc/observability/tls/client.key
            - --server-name
            - grafana.observability.svc.cluster.local
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        startupProbe:
          exec:
            command: *grafana_health_probe
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 60
        env:
        - name: GF_PATHS_CONFIG
          value: /etc/observability/config/grafana.ini
        - name: GF_INSTALL_PLUGINS
          value: ''
        - name: BACKEND_CA
          valueFrom:
            secretKeyRef:
              name: grafana-tls
              key: backend-ca.crt
        - name: BACKEND_CLIENT_CERT
          valueFrom:
            secretKeyRef:
              name: grafana-tls
              key: client.crt
        - name: BACKEND_CLIENT_KEY
          valueFrom:
            secretKeyRef:
              name: grafana-tls
              key: client.key
      volumes:
      - name: tls
        secret:
          secretName: grafana-tls
          defaultMode: 288
      - name: config
        configMap:
          name: observability-config
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
      - name: data
        persistentVolumeClaim:
          claimName: grafana
      - name: credentials
        secret:
          secretName: grafana-credentials
          defaultMode: 288
      - name: datasources
        configMap:
          name: grafana-datasources
      - name: dashboard-provider
        configMap:
          name: grafana-dashboard-provider
      - name: dashboard
        configMap:
          name: grafana-dashboard
