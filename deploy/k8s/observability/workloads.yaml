        runAsNonRoot: true
        runAsUser: 473
        runAsGroup: 473
        fsGroup: 473
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: alloy
        image: payment-system-observability-alloy:@IMAGE_TAG@
