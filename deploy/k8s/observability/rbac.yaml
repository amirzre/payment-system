apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: observability
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loki
  namespace: observability
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tempo
  namespace: observability
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: observability
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  namespace: observability
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: observability-prometheus
  namespace: payment-system
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: observability-prometheus
  namespace: payment-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: observability-prometheus
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: observability-alloy
  namespace: payment-system
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ''
  resources:
  - pods/log
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: observability-alloy
  namespace: payment-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: observability-alloy
subjects:
- kind: ServiceAccount
  name: alloy
  namespace: observability
