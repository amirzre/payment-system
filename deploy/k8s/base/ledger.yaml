apiVersion: v1
kind: Service
metadata:
  name: ledger-service
  namespace: payment-system
spec:
  selector:
    app: ledger
  ports:
    - port: 50052
      targetPort: 50052
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger
  namespace: payment-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ledger
  template:
    metadata:
      labels:
        app: ledger
    spec:
      containers:
        - name: ledger
          image: payment-system-ledger:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50052
          env:
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: payment-system-secrets
                  key: pg-user
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payment-system-secrets
                  key: pg-password
            - name: SERVER_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: payment-system-config
                  key: server-environment
            - name: SERVER_PORT
              value: "50052"
            - name: DATABASE_URL
              value: postgres://$(PG_USER):$(PG_PASSWORD)@postgres-ledger:5432/ledger?sslmode=disable
            - name: NATS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: payment-system-config
                  key: nats-url
          livenessProbe:
            tcpSocket:
              port: 50052
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 50052
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
