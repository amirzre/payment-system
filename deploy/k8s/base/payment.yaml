apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: payment-system
spec:
  selector:
    app: payment
  ports:
    - port: 50053
      targetPort: 50053
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: payment-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment
  template:
    metadata:
      labels:
        app: payment
    spec:
      containers:
        - name: payment
          image: payment-system-payment:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50053
          env:
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: payment-system-secrets
                  key: pg-user
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payment-system-secrets
                  key: pg-password
            - name: SERVER_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: payment-system-config
                  key: server-environment
            - name: SERVER_PORT
              value: "50053"
            - name: DATABASE_URL
              value: postgres://$(PG_USER):$(PG_PASSWORD)@postgres-payment:5432/payment?sslmode=disable
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: payment-system-config
                  key: redis-url
            - name: NATS_URL
              valueFrom:
                configMapKeyRef:
                  name: payment-system-config
                  key: nats-url
            - name: ACCOUNT_GRPC_ADDR
              value: account-service:50051
            - name: LEDGER_GRPC_ADDR
              value: ledger-service:50052
          livenessProbe:
            tcpSocket:
              port: 50053
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 50053
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
