apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: payment-system
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: payment-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: payment-system-api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SERVER_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: payment-system-config
                  key: server-environment
            - name: SERVER_PORT
              value: "8080"
            - name: ACCOUNT_GRPC_ADDR
              value: account-service:50051
            - name: PAYMENT_GRPC_ADDR
              value: payment-service:50053
            - name: AUTH_GRPC_ADDR
              value: auth-service:50054
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
