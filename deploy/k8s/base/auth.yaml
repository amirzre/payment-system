apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: payment-system
spec:
  selector:
    app: auth
  ports:
    - port: 50054
      targetPort: 50054
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: payment-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: payment-system-auth:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50054
          env:
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: payment-system-secrets
                  key: pg-user
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payment-system-secrets
                  key: pg-password
            - name: SERVER_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: payment-system-config
                  key: server-environment
            - name: SERVER_PORT
              value: "50054"
            - name: DATABASE_URL
              value: postgres://$(PG_USER):$(PG_PASSWORD)@postgres-auth:5432/auth?sslmode=disable
            - name: PRIVATE_KEY_PEM
              valueFrom:
                secretKeyRef:
                  name: payment-system-secrets
                  key: private-key-pem
            - name: PUBLIC_KEY_PEM
              valueFrom:
                secretKeyRef:
                  name: payment-system-secrets
                  key: public-key-pem
          livenessProbe:
            tcpSocket:
              port: 50054
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 50054
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
