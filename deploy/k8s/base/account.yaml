apiVersion: v1
kind: Service
metadata:
  name: account-service
  namespace: payment-system
spec:
  selector:
    app: account
  ports:
    - port: 50051
      targetPort: 50051
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: account
  namespace: payment-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: account
  template:
    metadata:
      labels:
        app: account
    spec:
      containers:
        - name: account
          image: payment-system-account:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50051
          env:
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: payment-system-secrets
                  key: pg-user
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payment-system-secrets
                  key: pg-password
            - name: SERVER_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: payment-system-config
                  key: server-environment
            - name: SERVER_PORT
              value: "50051"
            - name: DATABASE_URL
              value: postgres://$(PG_USER):$(PG_PASSWORD)@postgres-account:5432/account?sslmode=disable
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: payment-system-config
                  key: redis-url
            - name: NATS_URL
              valueFrom:
                configMapKeyRef:
                  name: payment-system-config
                  key: nats-url
            - name: LEDGER_GRPC_ADDR
              value: ledger-service:50052
          livenessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
